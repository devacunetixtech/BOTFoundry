[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# Speed up compilations
optimizer = true
optimizer_runs = 200

# Pin EVM version to avoid the PUSH0 opcode (Shanghai) on chains that don't support it
evm_version = "paris"

[rpc_endpoints]
botchain_testnet = "https://rpc.bohr.life"
botchain_mainnet = "https://rpc.botchain.ai"
